[SERVICE]
    Flush               1
    Log_Level           info
    Parsers_File        parsers.conf
    HTTP_Server         On
    HTTP_Listen         0.0.0.0
    HTTP_Port           2020
    Health_Check        On
    storage.path        /var/lib/fluent-bit/storage

[INPUT]
    Name                tail
    Path                /var/log/containers/*.log
    Exclude_Path        /var/log/containers/*_logging_*.log
    Tag                 kube.*
    multiline.parser    docker, cri
    DB                  /var/lib/fluent-bit/tail.db
    Read_from_Head      On
    Refresh_Interval    5
    Mem_Buf_Limit       10MB
    Skip_Long_Lines     On
    storage.type        filesystem

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           Off
    Labels              On
    Annotations         Off

[FILTER]
    Name                parser
    Match               kube.*
    Key_Name            log
    Parser              application_json
    Reserve_Data        On
    Preserve_Key        Off

[OUTPUT]
    Name                es
    Match               kube.*
    Host                elasticsearch
    Port                9200
    Buffer_Size         4M
    Logstash_Format     On
    Logstash_Prefix     fluent-bit-logs
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Time_Key_Nanos      On
    Suppress_Type_Name  On
    Generate_ID         On
    Write_Operation     index
    Replace_Dots        On
    Retry_Limit         False
    storage.total_limit_size 1G
