apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
spec:
  clusterIP: None
  selector: {app: elasticsearch}
  ports:
    - {name: transport, port: 9300}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector: {app: elasticsearch}
  ports:
    - {name: http, port: 9200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
          env:
            - {name: discovery.type, value: single-node}
            - {name: ES_JAVA_OPTS, value: '-Xms512m -Xmx512m'}
            - {name: xpack.security.enabled, value: 'false'}
            - {name: node.store.allow_mmap, value: 'false'}
          ports:
            - {name: http, containerPort: 9200}
            - {name: transport, containerPort: 9300}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: '2', memory: 1536Mi}
          readinessProbe:
            httpGet: {path: '/_cluster/health?wait_for_status=yellow', port: http}
            initialDelaySeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
