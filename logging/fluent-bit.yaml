apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homework-fluent-bit
rules:
  - apiGroups: ['']
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homework-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homework-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
spec:
  selector:
    matchLabels: {app: fluent-bit}
  template:
    metadata:
      labels: {app: fluent-bit}
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      initContainers:
        - name: wait-for-template
          image: curlimages/curl:8.16.0
          command: [sh, -ec]
          args:
            - |
              until curl -fsS http://elasticsearch:9200/_index_template/homework-logs >/dev/null; do sleep 2; done
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:4.0.9
          ports:
            - {name: health, containerPort: 2020}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: health}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: logs, mountPath: /var/log, readOnly: true}
            - {name: docker, mountPath: /var/lib/docker/containers, readOnly: true}
            - {name: config, mountPath: /fluent-bit/etc, readOnly: true}
            - {name: state, mountPath: /var/lib/fluent-bit}
      volumes:
        - name: logs
          hostPath: {path: /var/log, type: Directory}
        - name: docker
          hostPath: {path: /var/lib/docker/containers, type: DirectoryOrCreate}
        - name: config
          configMap: {name: fluent-bit-config}
        - name: state
          hostPath: {path: /var/lib/fluent-bit, type: DirectoryOrCreate}
