apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging
resources:
  - namespace.yaml
  - elasticsearch.yaml
  - kibana.yaml
  - fluent-bit.yaml
  - bootstrap.yaml
configMapGenerator:
  - name: fluent-bit-config
    files:
      - config/fluent-bit.conf
      - config/parsers.conf
  - name: elasticsearch-template
    files:
      - config/index-template.json
