openapi: 3.0.3
info:
  title: BLT Stream Processing HTTP API
  version: 8.0.0
  description: 'Реализованный вариант: HTTP для биллинга, Apache Kafka для уведомлений.
    Все суммы в копейках RUB. Bearer-сессии из ДЗ №7.'
servers:
- url: http://arch.homework
security:
- BearerSession: []
paths:
  /auth/register:
    post:
      operationId: register
      description: Создаёт пользователя и счёт с нулевым балансом до ответа 201.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '409':
          description: Конфликт ключа операции или существующего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      security: []
  /auth/login:
    post:
      operationId: login
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /profile:
    get:
      operationId: profile
      description: Проверка сессии; используется новыми сервисами при каждом публичном
        запросе.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
  /billing/account:
    get:
      operationId: getAccount
      description: Счёт текущего пользователя; 404, если не создан.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '404':
          description: Объект не найден
  /billing/deposits:
    post:
      operationId: deposit
      description: Пополнение учебного счёта. Повтор operationId с теми же параметрами
        возвращает прежний результат; с другими — 409.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '409':
          description: Конфликт ключа операции или существующего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyRequest'
  /billing/withdrawals:
    post:
      operationId: withdraw
      description: Списание со своего счёта. Недостаток средств — 200/status=rejected;
        баланс остаётся прежним.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '409':
          description: Конфликт ключа операции или существующего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyRequest'
  /orders:
    post:
      operationId: createOrder
      description: Создаёт заказ, получает результат биллинга по HTTP, сохраняет paid/rejected
        и outbox. Письмо поступает асинхронно.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
  /orders/{id}:
    get:
      operationId: getOrder
      description: Свой заказ; чужой или отсутствующий — 404.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '404':
          description: Объект не найден
    parameters:
    - name: id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
  /notifications:
    get:
      operationId: listNotifications
      description: Сохранённые сообщения текущего пользователя. Для нового заказа
        список может быть временно пустым.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
      parameters:
      - name: orderId
        in: query
        required: false
        schema: *id001
    post:
      operationId: sendNotification
      description: Сохраняет сообщение на email текущего пользователя. Внешняя отправка
        не выполняется.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotification'
  /internal/accounts:
    post:
      operationId: createAccount
      description: Только Users → Billing, идемпотентно по userId. Недоступно через
        ingress.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      security:
      - ServiceKey: []
    servers:
    - url: http://blt-streaming-billing:8000
      description: ClusterIP в namespace blt
  /internal/charges:
    post:
      operationId: charge
      description: Только Orders → Billing. orderId является ключом идемпотентности.
        Недостаток средств — успешный HTTP-ответ с status=rejected.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Некорректный запрос
        '401':
          description: Нет действующей сессии или служебного ключа
        '409':
          description: Конфликт ключа операции или существующего пользователя
        '404':
          description: Счёт не найден
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      security:
      - ServiceKey: []
    servers:
    - url: http://blt-streaming-billing:8000
      description: ClusterIP в namespace blt
components:
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    Registration:
      type: object
      required:
      - username
      - password
      - firstName
      - lastName
      - email
      properties:
        username: &id002
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
        firstName: *id002
        lastName: *id002
        email:
          type: string
          format: email
        phone: *id002
    User:
      type: object
      required:
      - id
      - username
      - firstName
      - lastName
      - email
      properties:
        id: &id003
          type: integer
          format: int64
          minimum: 1
        username: *id002
        firstName: *id002
        lastName: *id002
        email:
          type: string
          format: email
    Login:
      type: object
      required:
      - username
      - password
      properties:
        username: *id002
        password: *id002
    Session:
      type: object
      required:
      - accessToken
      - tokenType
      - userId
      - expiresAt
      properties:
        accessToken: *id002
        tokenType:
          type: string
          enum:
          - Bearer
        userId: *id003
        expiresAt:
          type: string
          format: date-time
    AccountRequest:
      type: object
      required:
      - userId
      properties:
        userId: *id003
    Account:
      type: object
      required:
      - userId
      - balance
      - currency
      properties:
        userId: *id003
        balance:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum:
          - RUB
    MoneyRequest:
      type: object
      required:
      - operationId
      - amount
      properties:
        operationId: *id001
        amount: &id004
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Целое число копеек RUB.
    ChargeRequest:
      type: object
      required:
      - orderId
      - userId
      - amount
      properties:
        orderId: *id001
        userId: *id003
        amount: *id004
    Operation:
      type: object
      required:
      - operationId
      - userId
      - amount
      - kind
      - status
      - balance
      - reason
      properties:
        operationId: *id001
        userId: *id003
        amount: *id004
        kind:
          type: string
          enum:
          - deposit
          - withdrawal
          - charge
        status:
          type: string
          enum:
          - succeeded
          - rejected
        balance:
          type: integer
          format: int64
          minimum: 0
        reason: &id005
          type: string
          nullable: true
    OrderRequest:
      type: object
      required:
      - price
      properties:
        price: *id004
    Order:
      type: object
      required:
      - id
      - userId
      - price
      - status
      - reason
      - createdAt
      properties:
        id: *id001
        userId: *id003
        price: *id004
        status:
          type: string
          enum:
          - processing
          - paid
          - rejected
        reason: *id005
        createdAt:
          type: string
          format: date-time
    SendNotification:
      type: object
      required:
      - subject
      - body
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 10000
    InternalNotification:
      type: object
      required:
      - eventId
      - orderId
      - userId
      - email
      - subject
      - body
      - outcome
      properties:
        eventId: *id001
        orderId: *id001
        userId: *id003
        email:
          type: string
          format: email
        subject: *id002
        body: *id002
        outcome:
          type: string
          enum:
          - paid
          - rejected
    Notification:
      type: object
      required:
      - id
      - eventId
      - orderId
      - userId
      - email
      - subject
      - body
      - outcome
      - createdAt
      properties:
        id: *id001
        eventId: *id001
        orderId:
          type: string
          format: uuid
          nullable: true
        userId: *id003
        email:
          type: string
          format: email
        subject: *id002
        body: *id002
        outcome: *id005
        createdAt:
          type: string
          format: date-time
