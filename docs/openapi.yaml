openapi: 3.0.0
info:
  title: User Service
  version: 1.0.0
  description: RESTful CRUD API for users.
servers:
  - url: http://arch.homework
paths:
  /user:
    get:
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
            example:
              username: johndoe589
              firstName: John
              lastName: Doe
              email: bestjohn@doe.com
              phone: '+71002003040'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get user by ID
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
            example:
              firstName: Julie
              lastName: Doe
              email: bestjohn@doe.com
              phone: '+71004242424'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete user
      responses:
        '204':
          description: User deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    UserFields:
      type: object
      properties:
        username: { type: string, maxLength: 256 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    CreateUser:
      allOf:
        - $ref: '#/components/schemas/UserFields'
      required: [username, firstName, lastName, email]
    UpdateUser:
      allOf:
        - $ref: '#/components/schemas/UserFields'
    User:
      allOf:
        - $ref: '#/components/schemas/UserFields'
        - type: object
          required: [id, username, firstName, lastName, email]
          properties:
            id: { type: integer, format: int64 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, format: int32 }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
