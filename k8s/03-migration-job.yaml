apiVersion: batch/v1
kind: Job
metadata:
  name: blt-orders-api-migrations
  namespace: blt
  labels:
    app.kubernetes.io/name: blt-orders-api
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: blt
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blt-orders-api
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: vafomenko/blt-orders-api:4.0.0
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "Blt.Orders.Api.dll", "--migrate"]
          envFrom:
            - configMapRef:
                name: blt-orders-api-config
            - secretRef:
                name: blt-orders-api-db
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
