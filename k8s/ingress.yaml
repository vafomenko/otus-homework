apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blt-orders-api
  labels:
    app.kubernetes.io/name: blt-orders-api
    app.kubernetes.io/part-of: blt
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: blt-orders-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blt-orders-api-rewrite
  labels:
    app.kubernetes.io/name: blt-orders-api
    app.kubernetes.io/part-of: blt
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /otusapp/vyacheslav(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: blt-orders-api
                port:
                  name: http
