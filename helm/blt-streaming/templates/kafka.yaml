apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
spec:
  # The controller must reach its own Service before the broker passes readiness.
  publishNotReadyAddresses: true
  selector: {app: {{ .Release.Name }}-kafka}
  ports: [{name: kafka, port: 9092}, {name: controller, port: 9093}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
spec:
  serviceName: {{ .Release.Name }}-kafka
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-kafka}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-kafka}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ .Release.Name }}-kafka:9092"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@{{ .Release.Name }}-kafka:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports: [{name: kafka, containerPort: 9092}, {name: controller, containerPort: 9093}]
          readinessProbe:
            exec:
              command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "localhost:9092", --list]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.kafka.storage }}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-topics-{{ .Release.Revision }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: topics
          image: {{ .Values.kafka.image }}
          command: [/opt/kafka/bin/kafka-topics.sh]
          args: [--bootstrap-server, "{{ .Release.Name }}-kafka:9092", --create, --if-not-exists, --topic, blt.order.events.v1, --partitions, {{ .Values.kafka.partitions | quote }}, --replication-factor, "1"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
