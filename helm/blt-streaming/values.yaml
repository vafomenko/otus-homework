image:
  registry: vafomenko
  tag: "8.0.0"
  pullPolicy: IfNotPresent
services:
  - name: users
  - name: billing
  - name: orders
  - name: notifications
replicas: 1
database:
  image: postgres:17.6-alpine
  storage: 1Gi
  # Local classroom credentials; override via a private values file for a shared cluster.
  password: streaming-demo
internalApiKey: streaming-internal-demo-key
kafka:
  image: apache/kafka:4.1.2
  storage: 2Gi
  partitions: 3
ingress:
  enabled: true
  className: nginx
  host: arch.homework
