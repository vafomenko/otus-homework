{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blt-orders-api.dbSecretName" . }}
  labels:
    {{- include "blt-orders-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  Database__Username: {{ .Values.database.username | quote }}
  Database__Password: {{ .Values.database.password | quote }}
{{- end }}
