kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8085
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 3005
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 9095
        listenAddress: "127.0.0.1"
