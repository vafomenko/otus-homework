apiVersion: v1
kind: Namespace
metadata:
  name: blt
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-demo
  namespace: blt
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  MONITOR_PASSWORD: monitoring-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: blt
data:
  01-users.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres \
      --set=monitor_password="$MONITOR_PASSWORD" <<'SQL'
    CREATE USER users WITH PASSWORD 'change-me';
    CREATE DATABASE users OWNER users;
    CREATE USER postgres_exporter WITH PASSWORD :'monitor_password';
    GRANT pg_monitor TO postgres_exporter;
    GRANT CONNECT ON DATABASE users TO postgres_exporter;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: blt
spec:
  selector: {app: users-db}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: blt
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels: {app: users-db}
  template:
    metadata:
      labels: {app: users-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          envFrom:
            - secretRef: {name: postgres-demo}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d users"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: blt
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-exporter}
  template:
    metadata:
      labels: {app: postgres-exporter}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - {name: DATA_SOURCE_URI, value: "users-db:5432/users?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: postgres_exporter}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: postgres-demo, key: MONITOR_PASSWORD}
          ports:
            - {name: metrics, containerPort: 9187}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: blt
spec:
  selector: {app: postgres-exporter}
  ports:
    - {name: metrics, port: 9187}
